name: Deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deployment
  cancel-in-progress: false

env:
  PROJECT_ID: unique-machine-360813
  GAR_LOCATION: us-west1
  SERVICE: hwh-bot-img
  IMAGE: hwh-rs-bot

jobs:
  delete-existing-images:
    name: Delete existing Docker images
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
        - name: Check out
          uses: actions/checkout@v7

        - name: Google Auth
          id: auth
          uses: 'google-github-actions/auth@v3'
          with:
            token_format: 'access_token'
            workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
            service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

        - name: Set up Cloud SDK
          uses: 'google-github-actions/setup-gcloud@v3'

        - name: Delete unnecessary docker image
          run: gcloud artifacts docker images delete '${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.IMAGE }}' --delete-tags || (echo "Already deleted."; exit 0)

  build-and-push:
    name: Build and push Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: delete-existing-images
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
        - name: Check out
          uses: actions/checkout@v7

        - name: Google Auth
          id: auth
          uses: 'google-github-actions/auth@v3'
          with:
            token_format: 'access_token'
            workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
            service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

        - name: Log in to GAR
          uses: 'docker/login-action@v4'
          with:
            username: 'oauth2accesstoken'
            password: '${{ steps.auth.outputs.access_token }}'
            registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'

        - name: Log in to Docker Hub
          uses: docker/login-action@v4
          with:
            username: '${{ vars.DOCKERHUB_USERNAME }}'
            password: '${{ secrets.DOCKERHUB_TOKEN }}'

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Build and push Docker image
          uses: docker/build-push-action@v7
          with:
            context: .
            file: ./Dockerfile
            push: true
            platforms: linux/${{ matrix.arch }}
            tags: |
              ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
              yngyu/hwh-rs-bot:${{ github.sha }}-${{ matrix.arch }}
            provenance: 'false'

  create-multiarch-manifests:
    name: Create and push multi-arch manifests
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v3'
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Log in to GAR
        uses: 'docker/login-action@v4'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: '${{ vars.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'

      - name: Create and push GAR manifest
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          MANIFEST_SHA="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.IMAGE }}:${{ github.sha }}"
          IMAGE_AMD64="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.IMAGE }}:${{ github.sha }}-amd64"
          IMAGE_ARM64="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.IMAGE }}:${{ github.sha }}-arm64"

          docker manifest create "${MANIFEST_SHA}" \
            --amend "${IMAGE_AMD64}" \
            --amend "${IMAGE_ARM64}"

          docker manifest push "${MANIFEST_SHA}"

      - name: Create and push Docker Hub manifest
        run: |
          docker manifest create yngyu/hwh-rs-bot:latest \
            --amend yngyu/hwh-rs-bot:${{ github.sha }}-amd64 \
            --amend yngyu/hwh-rs-bot:${{ github.sha }}-arm64

          docker manifest push yngyu/hwh-rs-bot:latest
